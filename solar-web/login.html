<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Acceso Administrador | SolarWeb</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css?v=1.0.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
    <style>
        body.login-body {
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95)), 
                url('img/solar_res_2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--white);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .login-logo .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(255,193,7,0.5));
        }

        .login-logo .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--white);
        }

        .login-logo .logo-text span {
            color: var(--primary-light);
        }

        .login-container h1 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .login-container p {
            font-size: 0.9rem;
            color: var(--gray-400);
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray-200);
        }

        .form-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        #loginError {
            display: none;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .demo-credentials {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--gray-400);
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            display: inline-block;
        }
        
        .demo-credentials code {
            color: var(--primary-light);
        }
    </style>
</head>

<body class="login-body">

    <div class="login-container">
        <a href="index.html" class="login-logo">
            <div class="logo-icon">☀️</div>
            <div class="logo-text">Solar<span>Admin</span></div>
        </a>

        <div id="loginError">Usuario o contraseña incorrectos.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Correo Electrónico</label>
                <input type="email" id="username" placeholder="admin@ejemplo.com" required />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Ingresar</button>
            <a href="index.html" class="btn-back" style="display: block; margin-top: 1rem; text-align: center; color: var(--gray-400); font-size: 0.9rem; text-decoration: none; padding: 0.5rem;">← Regresar al inicio</a>
        </form>
    </div>

    <script>
        // Check if force login is requested (from footer link)
        const urlParams = new URLSearchParams(window.location.search);
        const forceLogin = urlParams.get('force') === 'true';
        
        // Only auto-redirect if not forcing login and session exists
        if (!forceLogin) {
            checkSession().then(session => {
                if (session) {
                    console.log("Sesión activa detectada en login, redirigiendo a admin...");
                    window.location.replace('admin.html');
                }
            }).catch(err => {
                console.error("Error comprobando sesión en login:", err);
            });
        } else {
            console.log("Force login activado - mostrando formulario de login");
            // Cerrar sesión existente si hay una
            checkSession().then(session => {
                if (session) {
                    supabaseClient.auth.signOut().then(() => {
                        console.log("Sesión cerrada para forzar nuevo login");
                    });
                }
            });
        }

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('username').value; // Ahora usamos el email del usuario
            const pass = document.getElementById('password').value;
            
            submitBtn.textContent = 'Autenticando...';
            submitBtn.style.opacity = '0.8';
            submitBtn.disabled = true;
            loginError.style.display = 'none'; // Ocultar error previo

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass
                });
                
                if (error) {
                    console.error("Error detallado de Supabase:", error);
                    throw error;
                }
                
                if (data.session) {
                    // Éxito - usar replace en vez de href para evitar el historial de back
                    console.log("Login exitoso, redirigiendo a admin...");
                    window.location.replace('admin.html');
                } else {
                    throw new Error("No se pudo establecer la sesión");
                }
            } catch (err) {
                console.error("Error completo en login:", err);
                loginError.style.display = 'block';
                
                // Mensajes más amigables
                if (err.message.includes('Invalid login credentials')) {
                    loginError.textContent = 'Usuario o contraseña incorrectos.';
                } else if (err.message.includes('Email not confirmed')) {
                    loginError.textContent = 'Por favor confirma tu correo electrónico primero.';
                } else {
                    loginError.textContent = 'Error: ' + err.message;
                }
                
                // Shake animation using standard CSS
                const container = document.querySelector('.login-container');
                container.style.transform = 'translateX(10px)';
                setTimeout(() => container.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => container.style.transform = 'translateX(10px)', 200);
                setTimeout(() => container.style.transform = 'translateX(0)', 300);
                
                submitBtn.textContent = 'Ingresar';
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
