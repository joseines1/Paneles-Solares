services:
  - type: web
    name: paneles-solares
    runtime: node
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=604800, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800, immutable
